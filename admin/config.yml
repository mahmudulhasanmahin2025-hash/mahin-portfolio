backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"

media_folder: "uploads"
public_folder: "/uploads"
publish_mode: simple
show_preview_links: false

collections:
  - name: "site"
    label: "Portfolio details"
    files:
      - name: "site"
        label: "Home, about & contact"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Short role line", name: "eyebrow", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "About heading (use | to split onto a second line)", name: "aboutHeading", widget: "string" }
          - { label: "About text", name: "aboutText", widget: "text" }
          - { label: "University", name: "university", widget: "string" }
          - { label: "Degree", name: "degree", widget: "string" }
          - { label: "Contact note", name: "contactNote", widget: "text" }
          - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Social links"
            name: "links"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
  - name: "projects"
    label: "Projects"
    files:
      - name: "projects"
        label: "Selected work"
        file: "content/projects.json"
        format: "json"
        fields:
          - label: "Project cards"
            name: "projects"
            widget: "list"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Project URL", name: "url", widget: "string", required: false }
              - { label: "Tags", name: "tags", widget: "list", required: false }
